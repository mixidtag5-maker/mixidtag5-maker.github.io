<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konsolownia - Akcesoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="akcesoria.css">
</head>

<body>

    <div class="header-wrapper">
        <div class="header-accent"></div>
        <nav class="header">
            <div class="logo-container">
                <a href="../"><img src="../images/konsolownia.png" alt="Konsolownia Logo"></a>
            </div>
            <div class="hamburger" role="button" aria-label="Menu" tabindex="0">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links">
                <li><a href="../">USŁUGI</a></li>
                <li><a href="./">PADY & AKCESORIA</a></li>
                <li><a href="../wysylka/">WYSYŁKA</a></li>
                <li><a href="../kontakt/">KONTAKT</a></li>
            </ul>
        </nav>
    </div>

    <main class="akcesoria-main">
        <h1 class="page-title">CUSTOMOWE PADY!</h1>

        <div class="custom-gallery">
            <div class="gallery-grid">
                <!-- Large swiping block -->
                <div class="gallery-large-block gallery-item">
                    <button class="slider-arrow prev-arrow" aria-label="Previous image">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                    <button class="slider-arrow next-arrow" aria-label="Next image">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>

                    <div class="gallery-slider">
                        <div class="slider-item">
                            <img src="../images/pady/pad1.png" alt="Customowy Pad 1">
                        </div>
                        <div class="slider-item">
                            <img src="../images/pady/pad2.png" alt="Customowy Pad 2">
                        </div>
                        <div class="slider-item">
                            <img src="../images/pady/pad3.png" alt="Customowy Pad 3">
                        </div>
                    </div>

                    <div class="slider-indicators" role="tablist">
                        <span class="indicator active" data-index="0" role="tab" tabindex="0" aria-label="Slajd 1"
                            aria-selected="true"></span>
                        <span class="indicator" data-index="1" role="tab" tabindex="0" aria-label="Slajd 2"
                            aria-selected="false"></span>
                        <span class="indicator" data-index="2" role="tab" tabindex="0" aria-label="Slajd 3"
                            aria-selected="false"></span>
                    </div>
                </div>

                <!-- 8 Smaller blocks -->
                <div class="gallery-small-block gallery-item">
                    <img src="../images/pady/pad4.png" alt="Customowy Pad 4">
                </div>
                <div class="gallery-small-block gallery-item">
                    <img src="../images/pady/pad5.png" alt="Customowy Pad 5">
                </div>
                <div class="gallery-small-block gallery-item">
                    <img src="../images/pady/pad6.png" alt="Customowy Pad 6">
                </div>
                <div class="gallery-small-block gallery-item">
                    <img src="../images/pady/pad7.png" alt="Customowy Pad 7">
                </div>
                <div class="gallery-small-block gallery-item">
                    <img src="../images/pady/pad8.png" alt="Customowy Pad 8">
                </div>
                <div class="gallery-small-block gallery-item">
                    <img src="../images/pady/pad9.png" alt="Customowy Pad 9">
                </div>
                <div class="gallery-small-block gallery-item">
                    <img src="../images/pady/pad10.png" alt="Customowy Pad 10">
                </div>
                <div class="gallery-small-block gallery-item">
                    <img src="../images/pady/pad11.png" alt="Customowy Pad 11">
                </div>
            </div>
            <h1 class="page-title" style="margin-top: 80px;">STOJAKI</h1>

            <div class="stojaki-slider-container">
                <button class="slider-arrow prev-arrow stojaki-prev" aria-label="Previous image">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M15 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
                <button class="slider-arrow next-arrow stojaki-next" aria-label="Next image">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>

                <div class="stojaki-slider">
                    <div class="stojaki-item">
                        <img src="../images/stojaki/58c4ffa3-fc5d-47c8-93b4-928f5fe8b265.jpg" alt="Stojak">
                    </div>
                    <div class="stojaki-item">
                        <img src="../images/stojaki/6ff23b5e-7c3e-4bc6-9e9f-a4c78ec19944 (1).jpg" alt="Stojak">
                    </div>
                    <div class="stojaki-item">
                        <img src="../images/stojaki/b44e65d2-81ef-49c8-bd2f-269dceb7cdeb.jpg" alt="Stojak">
                    </div>
                    <div class="stojaki-item">
                        <img src="../images/stojaki/de9a9421-7ab4-4774-8426-0d872a76a481.jpg" alt="Stojak">
                    </div>
                    <div class="stojaki-item">
                        <img src="../images/stojaki/e862455b-3d27-461d-97de-fdd8f187ab4a.jpg" alt="Stojak">
                    </div>
                    <div class="stojaki-item">
                        <img src="../images/stojaki/fd884126-16fa-4095-8abf-8b1bd3817d37.jpg" alt="Stojak">
                    </div>
                </div>
            </div>
    </main>

    <script>
        // croll i burger menu
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header-wrapper');
            if (window.scrollY > 10) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            hamburger.classList.toggle('active');
        });

        hamburger.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                navLinks.classList.toggle('active');
                hamburger.classList.toggle('active');
            }
        });

        // Slajdy padów
        const slider = document.querySelector('.gallery-slider');
        const prevBtn = document.querySelector('.prev-arrow');
        const nextBtn = document.querySelector('.next-arrow');
        const indicators = document.querySelectorAll('.indicator');

        const SLIDE_DURATION = 4000;
        document.querySelector('.slider-indicators').style.setProperty('--slide-duration', `${SLIDE_DURATION / 1000}s`);

        let currentIndex = 0;
        const totalItems = indicators.length;
        let autoTimer = null;

        function restartIndicatorAnimation(ind) {
            ind.classList.remove('active');
            void ind.offsetWidth;
            ind.classList.add('active');
        }

        function updateSlider(resetTimer = true) {
            const itemWidth = slider.clientWidth;
            slider.scrollTo({
                left: currentIndex * itemWidth,
                behavior: 'smooth'
            });

            indicators.forEach((ind, i) => {
                if (i === currentIndex) {
                    restartIndicatorAnimation(ind);
                    ind.setAttribute('aria-selected', 'true');
                } else {
                    ind.classList.remove('active');
                    ind.setAttribute('aria-selected', 'false');
                }
            });

            if (resetTimer) {
                clearInterval(autoTimer);
                startAutoScroll();
            }
        }

        function startAutoScroll() {
            autoTimer = setInterval(() => {
                currentIndex = (currentIndex + 1) % totalItems;
                updateSlider(false);
            }, SLIDE_DURATION);
        }

        prevBtn.addEventListener('click', () => {
            currentIndex = currentIndex > 0 ? currentIndex - 1 : totalItems - 1;
            updateSlider();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = currentIndex < totalItems - 1 ? currentIndex + 1 : 0;
            updateSlider();
        });

        // Klikanie w kropki
        indicators.forEach(indicator => {
            indicator.addEventListener('click', (e) => {
                currentIndex = parseInt(e.target.getAttribute('data-index'));
                updateSlider();
            });
            indicator.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    currentIndex = parseInt(e.target.getAttribute('data-index'));
                    updateSlider();
                }
            });
        });

        let scrollDebounce;
        slider.addEventListener('scroll', () => {
            clearTimeout(scrollDebounce);
            scrollDebounce = setTimeout(() => {
                const itemWidth = slider.clientWidth;
                const newIndex = Math.round(slider.scrollLeft / itemWidth);
                if (newIndex !== currentIndex) {
                    currentIndex = newIndex;
                    updateSlider();
                }
            }, 80);
        });

        // Start
        updateSlider(false);
        startAutoScroll();

        // Slider stojaki
        const stojakiSlider = document.querySelector('.stojaki-slider');
        const stojakiPrevBtn = document.querySelector('.stojaki-prev');
        const stojakiNextBtn = document.querySelector('.stojaki-next');
        let stojakiAutoTimer = null;

        function startStojakiAutoScroll() {
            stojakiAutoTimer = setInterval(() => {
                const itemWidth = stojakiSlider.querySelector('.stojaki-item').clientWidth + 20;

                if (stojakiSlider.scrollLeft + stojakiSlider.clientWidth >= stojakiSlider.scrollWidth - 10) {
                    stojakiSlider.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    stojakiSlider.scrollBy({ left: itemWidth, behavior: 'smooth' });
                }
            }, 5000);
        }

        function resetStojakiTimer() {
            clearInterval(stojakiAutoTimer);
            startStojakiAutoScroll();
        }

        stojakiPrevBtn.addEventListener('click', () => {
            const itemWidth = stojakiSlider.querySelector('.stojaki-item').clientWidth + 20;

            if (stojakiSlider.scrollLeft <= 10) {
                stojakiSlider.scrollTo({ left: stojakiSlider.scrollWidth, behavior: 'smooth' });
            } else {
                stojakiSlider.scrollBy({ left: -itemWidth, behavior: 'smooth' });
            }
            resetStojakiTimer();
        });

        stojakiNextBtn.addEventListener('click', () => {
            const itemWidth = stojakiSlider.querySelector('.stojaki-item').clientWidth + 20;

            if (stojakiSlider.scrollLeft + stojakiSlider.clientWidth >= stojakiSlider.scrollWidth - 10) {
                stojakiSlider.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
                stojakiSlider.scrollBy({ left: itemWidth, behavior: 'smooth' });
            }
            resetStojakiTimer();
        });

        stojakiSlider.addEventListener('touchstart', () => clearInterval(stojakiAutoTimer));
        stojakiSlider.addEventListener('touchend', () => resetStojakiTimer());
        stojakiSlider.addEventListener('mouseenter', () => clearInterval(stojakiAutoTimer));
        stojakiSlider.addEventListener('mouseleave', () => resetStojakiTimer());

        startStojakiAutoScroll();
    </script>
</body>

</html>
